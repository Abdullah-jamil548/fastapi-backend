name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        env:
          URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Add a repo secret named RENDER_HEALTH_URL (your Render URL, e.g. https://your-app.onrender.com/)"
            exit 1
          fi
          curl -fsS --max-time 60 "$URL"
